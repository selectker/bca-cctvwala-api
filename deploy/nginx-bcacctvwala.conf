# /etc/nginx/sites-available/bcacctvwala  ->  symlink into sites-enabled
# Replace api.example.com with your domain (its DNS A record must point at the EC2 public/Elastic IP).
# Then:  sudo certbot --nginx -d api.example.com   (certbot adds the HTTPS block and the redirect)
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Six 10 MB ticket photos in one request need up to 61 MB. Restores of big backups need more (MAX_RESTORE_MB).
    client_max_body_size 64m;

    # JSON lists compress ~5-10x; this is the biggest win on a mobile connection. PDFs and photos are already
    # compressed, so only text types are listed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/plain text/csv;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3700s;   # backups / restores can take a while
        proxy_send_timeout 3700s;
        proxy_request_buffering off;
    }
}
