name: Deploy to EC2

# Manual deploy only: run it from the Actions tab -> "Deploy to EC2" -> "Run workflow".
# It no longer runs on push.
on:
  workflow_dispatch:

# never run two deploys at once, and never cancel one halfway
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: ${{ secrets.EC2_HOST }}
      USER_NAME: ${{ secrets.EC2_USER }}
      # folder on the server that holds the Dockerfile and your .env
      APP_DIR: ${{ vars.APP_DIR || '/home/ubuntu/BCAcctvWala-api' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<CFG
          Host ec2
            HostName $HOST
            User $USER_NAME
            IdentityFile ~/.ssh/deploy_key
            ServerAliveInterval 30
            ServerAliveCountMax 20
          CFG

      - name: Copy code to the server (the server's .env is never touched)
        run: |
          ssh ec2 "mkdir -p '$APP_DIR'"
          rsync -az --delete \
            --exclude '.git' --exclude '.github' \
            --exclude '.env' --exclude '.env.*' \
            --exclude 'tests' --exclude '__pycache__' --exclude '*.zip' \
            ./ "ec2:$APP_DIR/"

      - name: Build, migrate and restart (deploy/deploy.sh)
        run: ssh ec2 "cd '$APP_DIR' && bash deploy/deploy.sh --yes"

      - name: Prune old pre-deploy database copies (keep the newest 20)
        run: ssh ec2 'ls -1t ~/db-backups/pre-deploy-*.dump 2>/dev/null | tail -n +21 | xargs -r rm -f'